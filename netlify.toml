[build]
  command = "npm run build"
  publish = "dist"

# Prevent Netlify CDN from caching API responses
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

# Proxy /api/* to Hostinger backend — avoids CORS entirely
[[redirects]]
  from = "/api/*"
  to = "https://inoutcatalogue.inoutfashion.in/api/:splat"
  status = 200
  force = true
  headers = {Host = "inoutcatalogue.inoutfashion.in"}

# SPA fallback — must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
